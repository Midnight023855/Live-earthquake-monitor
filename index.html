<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Sísmico Multi-Agencia | EQuake Style</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: #0d0d0d;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: #111;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #222;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header .status {
            font-size: 12px;
            color: #4caf50;
        }

        .header .status::before {
            content: '●';
            margin-right: 4px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Main layout */
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Left panel */
        .left-panel {
            width: 340px;
            background: #121212;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #222;
            flex-shrink: 0;
        }

        /* Current event card */
        .current-event {
            background: linear-gradient(135deg, #1a3a5c, #0d2b4a);
            margin: 10px;
            border-radius: 10px;
            padding: 14px;
            border: 1px solid #2a5a8a;
            position: relative;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .current-event:hover {
            border-color: #4a9eff;
            box-shadow: 0 0 10px rgba(74, 158, 255, 0.2);
        }

        .current-event .intensity-big {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .intensity-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 0 12px rgba(0,0,0,0.4);
        }

        .current-event .location {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
        }

        .current-event .time {
            font-size: 12px;
            color: #a0c4e8;
            margin-top: 2px;
        }

        .current-event .details {
            display: flex;
            gap: 16px;
            margin-top: 10px;
            font-size: 13px;
        }

        .current-event .details span {
            color: #b0d0f0;
        }

        .current-event .details strong {
            color: #fff;
            font-size: 15px;
        }

        /* List header */
        .list-header {
            padding: 8px 14px;
            font-size: 12px;
            color: #888;
            border-bottom: 1px solid #222;
            display: flex;
            justify-content: space-between;
        }

        /* Event list */
        .event-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px;
        }

        .event-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
            margin-bottom: 2px;
        }

        .event-item:hover, .event-item.active {
            background: #1e1e1e;
        }

        .event-item.active {
            background: #1a2a3a;
            border-left: 3px solid #4a9eff;
        }

        .event-item .int-badge {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            color: #fff;
            flex-shrink: 0;
        }

        .event-item .info {
            flex: 1;
            min-width: 0;
        }

        .event-item .place {
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .event-item .meta {
            font-size: 11px;
            color: #888;
            margin-top: 2px;
        }

        .event-item .mag {
            font-size: 14px;
            font-weight: 600;
            color: #ccc;
            min-width: 48px;
            text-align: right;
        }

        .agency-tag {
            font-size: 10px;
            background: #333;
            padding: 1px 5px;
            border-radius: 3px;
            color: #aaa;
            margin-left: 4px;
        }

        /* Map area */
        .map-container {
            flex: 1;
            position: relative;
            background: #0a0a0a;
        }

        #map {
            width: 100%;
            height: 100%;
            background: #0a0a0a;
        }

        /* Bottom bar */
        .bottom-bar {
            background: #111;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid #222;
            flex-shrink: 0;
            font-size: 12px;
        }

        .bottom-bar .icons {
            display: flex;
            gap: 16px;
        }

        .bottom-bar .icon-btn {
            background: transparent;
            border: 1px solid #555;
            color: #ccc;
            font-size: 16px;
            width: 36px;
            height: 32px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .bottom-bar .icon-btn:hover {
            color: #fff;
            border-color: #888;
            background: #222;
        }

        .bottom-bar .time {
            color: #aaa;
            font-family: monospace;
        }

        /* Intensity colors matching the image style */
        .int-0 { background: #555; }
        .int-1 { background: #4a90d9; }
        .int-2 { background: #3bbf6e; }
        .int-3 { background: #7ed957; }
        .int-4 { background: #f0d000; color: #222 !important; }
        .int-5 { background: #ff9a00; }
        .int-6 { background: #ff4d00; }
        .int-7 { background: #d00000; }
        .int-VI { background: #ff4d00; }
        .int-IV { background: #f0d000; color: #222 !important; }
        .int-V { background: #ff9a00; }

        /* Scrollbar */
        .event-list::-webkit-scrollbar {
            width: 6px;
        }
        .event-list::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        .event-list::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 3px;
        }

        /* Cuadro de conexiones API propias */
        #connectionPanel {
            position:absolute; top:12px; right:12px; z-index:1001;
            min-width:205px; max-width:260px; max-height:52vh;
            overflow-y:auto; background:rgba(10,10,10,.90);
            border:1px solid rgba(255,255,255,.16); border-radius:7px;
            padding:8px 10px; box-shadow:0 2px 10px rgba(0,0,0,.45);
            font-size:11px; color:#ccc; backdrop-filter:blur(3px);
        }
        #connectionPanel .conn-title {
            color:#eee; font-weight:700; margin-bottom:5px;
            padding-bottom:4px; border-bottom:1px solid #333;
        }
        #connectionPanel .conn-row {
            display:flex; justify-content:space-between; gap:10px;
            line-height:18px; white-space:nowrap;
        }
        #connectionPanel .ok { color:#4caf50; }
        #connectionPanel .bad { color:#ff5555; }
        #connectionPanel .wait { color:#f0c84b; }

        /* Info overlay on map */
        .map-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(20,20,20,0.9);
            padding: 10px 14px;
            border-radius: 8px;
            z-index: 1000;
            font-size: 12px;
            border: 1px solid #333;
            max-width: 280px;
        }

        .map-info strong {
            color: #4a9eff;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>
            🌍 Monitor Sísmico Multi-Agencia
            <span style="font-size:11px;color:#666;font-weight:400;">| Estilo EQuake</span>
        </h1>
        <div style="display:flex; align-items:center; gap:10px;">
            <div class="status">Cargando sismos…</div>
            
            <!-- Botón TTS (Sintetizador de Voz) -->
            <button id="btnTTS" title="Activar/Desactivar Voz de Alerta (TTS)" style="
                background: #222;
                border: 1px solid #444;
                color: #ddd;
                font-size: 13px;
                padding: 0 10px;
                height: 34px;
                border-radius: 6px;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 6px;
                transition: all 0.2s;
            ">🔊 TTS: <span id="ttsStatus" style="color: #4caf50; font-weight: bold;">ON</span></button>

            <!-- Botón Pantalla Completa -->
            <button id="btnFullscreen" title="Pantalla completa" style="
                background: #222;
                border: 1px solid #444;
                color: #ddd;
                font-size: 16px;
                width: 34px;
                height: 34px;
                border-radius: 6px;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: all 0.2s;
            ">⛶</button>
        </div>
    </div>

    <div class="main">
        <!-- Left Panel -->
        <div class="left-panel">
            <div class="current-event" id="currentEvent" title="Haz clic para volver a escuchar el reporte por voz">
                <div class="intensity-big">
                    <div class="intensity-circle int-1" id="bigInt">1</div>
                    <div>
                        <div class="location" id="bigLoc">Kumamoto, Prefectura de Kumamoto</div>
                        <div class="time" id="bigTime">2026/08/03 07:12:58 · JMA</div>
                    </div>
                </div>
                <div class="details">
                    <div>
                        <span>Magnitud</span><br>
                        <strong id="bigMag">M2.3</strong>
                    </div>
                    <div>
                        <span>Profundidad</span><br>
                        <strong id="bigDepth">10 km</strong>
                    </div>
                </div>
            </div>

            <div class="list-header">
                <span>Eventos recientes (en vivo)</span>
                <span style="font-size:11px;color:#888;">USGS · JMA · CENC · EMSC · GFZ · SSN</span>
            </div>

            <div class="event-list" id="eventList">
                <!-- Events will be injected here -->
            </div>
        </div>

        <!-- Map -->
        <div class="map-container">
            <div id="map"></div>
            <div id="connectionPanel">
                <div class="conn-title">CONEXIONES · API PROPIA</div>
                <div id="connectionRows"></div>
            </div>

            <!-- Iconos fuera de la lista (esquina inferior izquierda del mapa) -->
            <div style="
                position: absolute;
                bottom: 16px;
                left: 12px;
                z-index: 1000;
                display: flex;
                gap: 6px;
            ">
                <button id="btnHome" title="Ir al último sismo" style="
                    background: rgba(20,20,20,0.9);
                    border: 1px solid #555;
                    color: #eee;
                    font-size: 16px;
                    width: 36px;
                    height: 32px;
                    border-radius: 5px;
                    cursor: pointer;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
                ">🏠</button>
                <button id="btnRefresh" title="Actualizar" style="
                    background: rgba(20,20,20,0.9);
                    border: 1px solid #555;
                    color: #eee;
                    font-size: 14px;
                    width: 36px;
                    height: 32px;
                    border-radius: 5px;
                    cursor: pointer;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
                ">🔄</button>
                <button id="btnTaiwan" title="Ver estaciones Taiwán en vivo" style="
                    background: rgba(20,20,20,0.9);
                    border: 1px solid #555;
                    color: #eee;
                    font-size: 13px;
                    height: 32px;
                    padding: 0 10px;
                    border-radius: 5px;
                    cursor: pointer;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
                    white-space: nowrap;
                ">🇹🇼 Taiwán</button>
                <button id="btnJapan" title="Ver estaciones Japón (JMA)" style="
                    background: rgba(20,20,20,0.9);
                    border: 1px solid #555;
                    color: #eee;
                    font-size: 13px;
                    height: 32px;
                    padding: 0 10px;
                    border-radius: 5px;
                    cursor: pointer;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
                    white-space: nowrap;
                ">🇯🇵 Japón</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ==========================================
        // SISTEMA DE AUDIO (Web Audio API)
        // ==========================================
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }
        ['click', 'keydown', 'touchstart'].forEach(evt => document.addEventListener(evt, initAudio, { once: true }));

        // Sonido 1: Actualización de lista / refresco suave
        function playUpdateSound() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.12);
            } catch (_) {}
        }

        // Sonido 2: Detección de sismo nuevo (Alarma / Ondas)
        function playDetectionSound() {
            if (!audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                const tones = [600, 900, 600, 900, 600, 900];
                const stepDuration = 0.12;
                tones.forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, now + index * stepDuration);
                    gain.gain.setValueAtTime(0.18, now + index * stepDuration);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + (index + 1) * stepDuration);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + index * stepDuration);
                    osc.stop(now + (index + 1) * stepDuration);
                });
            } catch (_) {}
        }

        // Sonido 3: Hora en punto (Carillón de revisión de conexiones)
        function playHourlyChime() {
            if (!audioCtx) return;
            try {
                const notes = [523.25, 659.25, 784.00]; // C5, E5, G5
                const now = audioCtx.currentTime;
                notes.forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + index * 0.25);
                    gain.gain.setValueAtTime(0.15, now + index * 0.25);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.25 + 0.6);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + index * 0.25);
                    osc.stop(now + index * 0.25 + 0.6);
                });
            } catch (_) {}
        }

        // ==========================================
        // SISTEMA DE TEXT-TO-SPEECH (TTS - Voz)
        // ==========================================
        let ttsEnabled = true;
        let announcedTtsIds = new Set();
        let activeEventForTts = null;

        function speakEvent(ev, force = false) {
            if (!ttsEnabled || !('speechSynthesis' in window) || !ev) return;

            // Formatear el texto de forma natural para voz
            let magVal = ev.mag ? ev.mag.replace('M', 'Magnitud ') : '';
            let placeVal = ev.place ? ev.place.replace(/,/g, ' ') : 'Lugar desconocido';
            let depthVal = (ev.depth && ev.depth !== '—') ? `Profundidad ${ev.depth.replace('km', 'kilómetros')}` : '';
            let agencyVal = ev.agency ? `Reportado por ${ev.agency.replace(/\(.*\)/, '')}` : '';

            let speechText = `Sismo detectado. ${magVal}. En ${placeVal}. ${depthVal}. ${agencyVal}.`;

            window.speechSynthesis.cancel(); // Cancelar cualquier audio anterior

            const utterance = new SpeechSynthesisUtterance(speechText);
            utterance.lang = 'es-ES';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;

            // Intentar asignar una voz limpia en español
            const voices = window.speechSynthesis.getVoices();
            const esVoice = voices.find(v => v.lang.startsWith('es') || v.lang.includes('ES'));
            if (esVoice) utterance.voice = esVoice;

            window.speechSynthesis.speak(utterance);
        }

        // Cargar voces en memoria
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        // Botón de alternar TTS
        const btnTTS = document.getElementById('btnTTS');
        const ttsStatus = document.getElementById('ttsStatus');
        if (btnTTS) {
            btnTTS.addEventListener('click', () => {
                ttsEnabled = !ttsEnabled;
                if (ttsEnabled) {
                    ttsStatus.textContent = 'ON';
                    ttsStatus.style.color = '#4caf50';
                    if (activeEventForTts) speakEvent(activeEventForTts, true);
                } else {
                    ttsStatus.textContent = 'OFF';
                    ttsStatus.style.color = '#ff5555';
                    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                }
            });
        }

        // Clic en la tarjeta principal de evento para repetir por voz
        const currentEventCard = document.getElementById('currentEvent');
        if (currentEventCard) {
            currentEventCard.addEventListener('click', () => {
                if (activeEventForTts) {
                    speakEvent(activeEventForTts, true);
                }
            });
        }


        // Programador de revisión de agencias a la hora en punto (:00:00)
        let lastHourChecked = -1;
        setInterval(() => {
            const now = new Date();
            if (now.getMinutes() === 0 && now.getSeconds() === 0 && now.getHours() !== lastHourChecked) {
                lastHourChecked = now.getHours();
                playHourlyChime();
                console.log('🔔 Hora en punto: Revisando conexiones de todas las agencias...');
                loadAll(true);
                checkEarlyEst();
                updateTaiwanRTS();
            }
        }, 1000);


        // ==========================================
        // VARIABLES Y CONFIGURACIÓN DEL MAPA
        // ==========================================
        let events = [];
        let highlight = null;
        let map = null;

        // Inicializar mapa
        map = L.map('map', {
            zoomControl: false,
            attributionControl: true
        }).setView([20, 140], 3);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap | Datos: USGS + Wolfx'
        }).addTo(map);

        // Look más oscuro
        document.getElementById('map').style.filter = 'invert(90%) hue-rotate(180deg) brightness(0.85) contrast(0.95)';

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        highlight = L.circle([32.8, 130.7], {
            radius: 40000,
            color: '#4a9eff',
            fillColor: '#4a9eff',
            fillOpacity: 0.2,
            weight: 2
        }).addTo(map);

        // ========== Estaciones Taiwán (TREM) en tiempo real ==========
        const taiwanStationsLayer = L.layerGroup().addTo(map);
        let taiwanStationMeta = {};   
        let taiwanMarkers = {};       

        function colorByTaiwanI(I) {
            const v = parseFloat(I);
            if (isNaN(v) || v < 0) return '#2a4a6a';      
            if (v < 1) return '#4a90d9';
            if (v < 2) return '#3bbf6e';
            if (v < 3) return '#7ed957';
            if (v < 4) return '#f0d000';
            if (v < 5) return '#ff9a00';
            if (v < 6) return '#ff4d00';
            return '#d00000';
        }

        async function loadTaiwanStations() {
            try {
                const res = await fetch('https://cdn.jsdelivr.net/gh/ExpTechTW/API@master/resource/station.json');
                const data = await res.json();
                taiwanStationMeta = {};
                Object.keys(data).forEach(id => {
                    const st = data[id];
                    if (!st || !st.info || !st.info.length) return;
                    const info = st.info[st.info.length - 1];
                    if (!info || info.lat == null || info.lon == null) return;
                    taiwanStationMeta[id] = {
                        lat: info.lat,
                        lon: info.lon,
                        net: st.net || 'TREM',
                        work: st.work
                    };
                });
                updateTaiwanRTS();
            } catch (e) {
                console.warn('No se pudieron cargar estaciones de Taiwán', e);
            }
        }

        async function updateTaiwanRTS() {
            try {
                const res = await fetch('https://api.lb-tpe1.exptech.dev/api/v2/trem/rts');
                const data = await res.json();
                const stations = (data && data.station) ? data.station : {};

                Object.keys(taiwanStationMeta).forEach(id => {
                    const meta = taiwanStationMeta[id];
                    const rt = stations[id];
                    const I = rt ? (rt.I != null ? rt.I : rt.i) : -3;
                    const pga = rt ? rt.pga : null;
                    const color = colorByTaiwanI(I);
                    const radius = (parseFloat(I) >= 0) ? 6 : 4;

                    if (taiwanMarkers[id]) {
                        taiwanMarkers[id].setStyle({
                            fillColor: color,
                            color: color,
                            radius: radius
                        });
                        taiwanMarkers[id].setPopupContent(
                            `<b>Estación ${id}</b><br>` +
                            `Red: ${meta.net}<br>` +
                            `Intensidad: ${I}<br>` +
                            (pga != null ? `PGA: ${pga}<br>` : '') +
                            `${meta.lat.toFixed(3)}, ${meta.lon.toFixed(3)}`
                        );
                    } else {
                        const m = L.circleMarker([meta.lat, meta.lon], {
                            radius: radius,
                            fillColor: color,
                            color: '#111',
                            weight: 1,
                            opacity: 0.9,
                            fillOpacity: 0.85
                        }).addTo(taiwanStationsLayer);
                        m.bindPopup(
                            `<b>Estación ${id}</b><br>` +
                            `Red: ${meta.net}<br>` +
                            `Intensidad: ${I}<br>` +
                            (pga != null ? `PGA: ${pga}<br>` : '') +
                            `${meta.lat.toFixed(3)}, ${meta.lon.toFixed(3)}`
                        );
                        taiwanMarkers[id] = m;
                    }
                });
            } catch (e) {

        function getColor(int) {
            const s = String(int).toUpperCase();
            const colors = {
                '0': '#555', 'I': '#555',
                '1': '#4a90d9', 'II': '#4a90d9',
                '2': '#3bbf6e', 'III': '#3bbf6e',
                '3': '#7ed957', 'IV': '#f0d000',
                '4': '#f0d000', 'V': '#ff9a00',
                '5': '#ff9a00', '5-': '#ff9a00', '5+': '#ff7700', 'VI': '#ff4d00',
                '6': '#ff4d00', '6-': '#ff4d00', '6+': '#e00000', 'VII': '#ff3300',
                '7': '#d00000', 'VIII': '#d00000', 'IX': '#b00000', 'X': '#900000',
                'XI': '#700000', 'XII': '#500000'
            };
            return colors[s] || '#888';
        }

        function intensityClass(int) {
            const s = String(int).toUpperCase();
            if (['0','1','2','3','4','5','6','7','5-','5+','6-','6+'].includes(s)) {
                if (s.startsWith('5')) return 'int-5';
                if (s.startsWith('6')) return 'int-6';
                return 'int-' + s.replace(/[+-]/,'');
            }
            if (['I','II','III'].includes(s)) return 'int-1';
            if (s === 'IV') return 'int-4';
            if (s === 'V') return 'int-5';
            if (s === 'VI' || s === 'VII') return 'int-6';
            if (['VIII','IX','X','XI','XII'].includes(s)) return 'int-7';
            return 'int-1';
        }

        function formatTime(t) {
            if (!t) return '—';
            try {
                const d = new Date(t);
                if (isNaN(d.getTime())) {
                    return String(t).replace(/-/g, '/').replace('T', ' ').slice(0, 19);
                }
                const pad = n => String(n).padStart(2, '0');
                return d.getFullYear() + '/' +
                    pad(d.getMonth() + 1) + '/' +
                    pad(d.getDate()) + ' ' +
                    pad(d.getHours()) + ':' +
                    pad(d.getMinutes()) + ':' +
                    pad(d.getSeconds());
            } catch (_) {
                return String(t).slice(0, 19);
            }
        }

        function parseTs(t) {
            if (!t && t !== 0) return 0;
            if (typeof t === 'number') return t;
            const d = new Date(t);
            return isNaN(d.getTime()) ? 0 : d.getTime();
        }

        function magToMMI(mag) {
            if (mag < 1.5) return 'I';
            if (mag < 2.5) return 'I';
            if (mag < 3.0) return 'II';
            if (mag < 3.5) return 'III';
            if (mag < 4.0) return 'IV';
            if (mag < 4.5) return 'V';
            if (mag < 5.0) return 'VI';
            if (mag < 5.5) return 'VII';
            if (mag < 6.0) return 'VIII';
            if (mag < 6.5) return 'IX';
            if (mag < 7.0) return 'X';
            if (mag < 7.5) return 'XI';
            return 'XII';
        }

        function magToShindo(mag) {
            if (mag < 2.5) return '1';
            if (mag < 3.5) return '2';
            if (mag < 4.5) return '3';
            if (mag < 5.0) return '4';
            if (mag < 5.5) return '5';
            if (mag < 6.0) return '6';
            return '7';
        }

        async function fetchUSGS() {
            try {
                const res = await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson');
                const data = await res.json();
                return (data.features || []).slice(0, 50).map((f, i) => {
                    const p = f.properties;
                    const coords = f.geometry.coordinates;
                    const mag = (p.mag != null && !isNaN(p.mag)) ? p.mag : 0;
                    const int = magToMMI(mag);
                    return {
                        id: 'usgs-' + (p.id || i),
                        intensity: int,
                        place: p.place || 'Desconocido',
                        time: formatTime(new Date(p.time).toISOString()),
                        mag: 'M' + Number(mag).toFixed(1),
                        depth: (coords[2] || 0).toFixed(0) + ' km',
                        agency: 'USGS',
                        lat: coords[1],
                        lon: coords[0],
                        colorClass: intensityClass(int),
                        ts: p.time
                    };
                });
            } catch (e) {
                console.warn('USGS error', e);
                return [];
            }
        }

        // Añade un sismo nuevo de inmediato a la lista (tiempo real)
        function addNewEvent(ev) {
            if (!ev || !ev.id) return;
            if (lastEventIds.has(ev.id)) return;

            events.unshift(ev);
            lastEventIds.add(ev.id);

            if (events.length > 60) {
                const removed = events.pop();
                lastEventIds.delete(removed.id);
            }

            renderEvents();
            playDetectionSound(); // 🔔 Alarma de sismo nuevo en tiempo real

            // Sintetizador de voz para el sismo en tiempo real
            if (!announcedTtsIds.has(ev.id)) {

                speakEvent(ev);

        }

        async function loadAll(force = false) {
            const status = document.querySelector('.status');

            try {
                const [usgs, jma, cenc, emsc, gfz, afad, bmkg, geonet, ingv, ga, sgc, ssn] = await Promise.all([
                    fetchUSGS().catch(() => []),
                    fetchWolfxJMA().catch(() => []),
                    fetchWolfxCENC().catch(() => []),
                    fetchEMSC().catch(() => []),
                    fetchGFZ().catch(() => []),
                    fetchAFAD().catch(() => []),
                    fetchBMKG().catch(() => []),
                    fetchGeoNet().catch(() => []),
                    fetchINGV().catch(() => []),
                    fetchGeoscienceAustralia().catch(() => []),
                    fetchSGC().catch(() => []),
                    fetchSSN().catch(() => [])
                ]);
                updateExistingApiStates();

                let newEvents = [...usgs, ...jma, ...cenc, ...emsc, ...gfz, ...afad, ...bmkg, ...geonet, ...ingv, ...ga, ...sgc, ...ssn];

                const now = Date.now();
                newEvents.forEach(e => {
                    e.ts = parseTs(e.ts) || parseTs(e.time) || 0;
                });

                newEvents = newEvents.filter(e => e.ts > 0 && e.ts <= now + 2 * 60 * 1000);

                const seen = new Set();
                newEvents = newEvents.filter(e => {
                    if (seen.has(e.id)) return false;
                    seen.add(e.id);
                    return true;
                });

                newEvents.sort((a, b) => (b.ts || 0) - (a.ts || 0));

                const currentIds = new Set(newEvents.map(e => e.id));
                const hasNew = newEvents.some(e => !lastEventIds.has(e.id));

                if (hasNew || isFirstLoad || force) {
                    events = newEvents;
                    renderEvents();

                    if (hasNew && !isFirstLoad) {
                        playDetectionSound(); // 🔔 Sismo nuevo detectado por polling
                        
                        // TTS para el nuevo evento detectado por polling
                        const newest = events[0];
                        if (newest && !announcedTtsIds.has(newest.id)) {
                            announcedTtsIds.add(newest.id);
                            speakEvent(newest);
                        }
                    } else if (!isFirstLoad) {
                        playUpdateSound(); // 🔔 Sonido de lista actualizada
                    }

                    // En la primera carga marcamos los IDs como conocidos para no hablar todos de golpe
                    if (isFirstLoad && events.length > 0) {
                        events.forEach(e => announcedTtsIds.add(e.id));
                    }

                    lastEventIds = currentIds;
                    isFirstLoad = false;

                    if (events.length > 0) {
                        selectEvent(events[0].id);
                    }

                    if (status) {
                        const src = [];
                        if (usgs.length) src.push('USGS');
                        if (jma.length) src.push('JMA');
                        if (cenc.length) src.push('CENC');
                        if (emsc.length) src.push('EMSC');
                        if (gfz.length) src.push('GFZ');
                        if (ssn.length) src.push('SSN');
                        if (sgc.length) src.push('SGC');
                        const clock = formatTime(new Date().toISOString());
                        status.textContent = `En vivo · ${events.length} · ${src.join('+') || '—'} · ${clock}`;
                        status.style.color = '#4caf50';
                    }
                }
            } catch (err) {
                console.error('Error al cargar:', err);
                if (status) {
                    status.textContent = 'Error de conexión';
                    status.style.color = '#ff5555';
                }
            }
        }

        // ========== WebSocket Wolfx (tiempo real EEW + listas) ==========
        let wsRetries = 0;
        const MAX_WS_RETRIES = 3;

        function connectWolfxWS() {
            if (wsRetries >= MAX_WS_RETRIES) {
                const status = document.querySelector('.status');
                if (status) {
                    status.textContent = 'En vivo · HTTP (todas las agencias)';
                    status.style.color = '#4caf50';
                }
                return;
            }

            let ws;
            try {
                ws = new WebSocket('wss://ws-api.wolfx.jp/all_eew');
            } catch (e) {
                wsRetries++;
                setTimeout(connectWolfxWS, 8000);
                return;
            }

            ws.onopen = () => {
                wsRetries = 0;
                const status = document.querySelector('.status');
                if (status) {
                    status.textContent = 'En vivo · WS + HTTP';
                    status.style.color = '#4caf50';
                }
                try {
                    ws.send('query_jmaeew');
                    ws.send('query_jmaeqlist');
                    ws.send('query_cenceew');
                    ws.send('query_cenceqlist');
                } catch (_) {}
            };

            ws.onmessage = (msg) => {
                try {
                    let raw = msg.data;
                    if (typeof raw !== 'string') return;
                    if (raw === 'ping' || raw === 'pong' || raw.length < 10) return;

                    const data = JSON.parse(raw);
                    if (!data || typeof data !== 'object') return;

                    let items = [];
                    if (Array.isArray(data)) {
                        items = data;
                    } else if (data.No1 || data.No2) {
                        for (let i = 1; i <= 30; i++) {
                            if (data['No' + i]) items.push(data['No' + i]);
                        }
                    } else {
                        items = [data];
                    }

                    items.forEach(item => {
                        if (!item || typeof item !== 'object') return;

                        const hasMag = item.Magunitude != null || item.Magnitude != null || item.magnitude != null || item.mag != null;
                        const hasPlace = item.Hypocenter || item.location || item.placeName || item.Title;
                        const hasInt = item.MaxIntensity != null || item.shindo != null || item.intensity != null;

                        if (!hasMag && !hasPlace && !hasInt) return;

                        const mag = parseFloat(item.Magunitude || item.Magnitude || item.magnitude || item.mag) || 0;
                        let int = item.MaxIntensity || item.shindo || item.intensity;
                        if (int == null || int === '') int = magToShindo(mag);
                        int = String(int).replace('強', '+').replace('弱', '-');

                        const place = item.Hypocenter || item.location || item.placeName || item.Title || 'Desconocido';
                        const lat = parseFloat(item.Latitude || item.latitude || item.lat) || 35;
                        const lon = parseFloat(item.Longitude || item.longitude || item.lon) || 139;
                        const depthVal = item.Depth || item.depth || '—';
                        const depth = String(depthVal).includes('km') ? String(depthVal) : depthVal + ' km';
                        const timeStr = item.OriginTime || item.AnnouncedTime || item.time || item.time_full || new Date().toISOString();
                        const eventId = item.EventID || item.id || (place + mag + timeStr);

                        const isEEW = !!(item.MaxIntensity || item.Title || item.CodeType || (item.Serial != null));
                        const agency = isEEW ? 'JMA (Wolfx EEW)' : (String(place).match(/中国|四川|云南|新疆|台湾/) ? 'CENC (Wolfx)' : 'JMA (Wolfx)');

                        const ev = {
                            id: 'ws-' + eventId,
                            intensity: String(int),
                            place: place,
                            time: formatTime(timeStr),
                            mag: 'M' + mag.toFixed(1),
                            depth: depth,
                            agency: agency,
                            lat: lat,
                            lon: lon,
                            colorClass: intensityClass(int),
                            ts: Date.now()
                        };

                        addNewEvent(ev);
                    });
                } catch (e) {}
            };

            ws.onclose = () => {
                wsRetries++;
                if (wsRetries < MAX_WS_RETRIES) {
                    const status = document.querySelector('.status');
                    if (status) {
                        status.textContent = 'WS reconectando…';
                        status.style.color = '#ffaa00';
                    }
                    setTimeout(connectWolfxWS, 7000);
                } else {
                    const status = document.querySelector('.status');
                    if (status) {
                        status.textContent = 'En vivo · HTTP (todas las agencias)';
                        status.style.color = '#4caf50';
                    }
                }
            };

            ws.onerror = () => {
                try { ws.close(); } catch (_) {}
            };
        }

        function normalizeFdsnFeature(f, agency, prefix, fallbackPlace) {

        async function fetchAFAD() {
            try {
                const end = new Date();
                const start = new Date(end.getTime() - 24 * 60 * 60 * 1000);
                const officialUrl = 'https://deprem.afad.gov.tr/apiv2/event/filter?' +
                    new URLSearchParams({
                        start: start.toISOString().slice(0,19),
                        end: end.toISOString().slice(0,19),
                        limit: '50',
                        orderby: 'timedesc',
                        format: 'json'
                    });

                let r;
                try {
                    r = await fetch(officialUrl, {cache:'no-store'});
                } catch (_) {
                    r = await fetch(
                        'https://api.allorigins.win/raw?url=' +
                        encodeURIComponent(officialUrl),
                        {cache:'no-store'}
                    );
                }

                if (!r.ok) throw new Error('HTTP ' + r.status);
                const d = await r.json();
                setApiState('afad','ok');

                const arr = Array.isArray(d) ? d : (d.data || d.events || []);
                return arr.map((x,i) => {
                    const lat = Number(x.latitude ?? x.lat ?? x.Enlem ?? 0);
                    const lon = Number(x.longitude ?? x.lon ?? x.Boylam ?? 0);
                    const mag = Number(x.magnitude ?? x.ml ?? x.Magnitude ?? 0);
                    const time = x.date ?? x.eventDate ?? x.time ?? x.OlusanTarih ?? '';
                    return {
                        id:'afad-' + (x.eventID ?? x.eventId ?? x.id ?? i),
                        intensity:magToMMI(mag),
                        place:x.location ?? x.locationName ?? x.yer ?? 'Turquía',
                        time:formatTime(time),
                        mag:'M' + mag.toFixed(1),
                        depth:(Number(x.depth ?? x.Depth ?? 0) || 0) + ' km',
                        agency:'AFAD', lat, lon,
                        colorClass:intensityClass(magToMMI(mag)),
                        ts:new Date(time).getTime() || Date.now()
                    };
                }).filter(e => e.mag !== 'M0.0');
            } catch(e) {
                setApiState('afad','bad');
                console.warn('AFAD API:',e);
                return [];
            }
        }

        async function fetchBMKG() {

                const q = d?.Infogempa?.gempa;

                setApiState('bmkg','ok');
                const coords = String(q.Coordinates || '').split(',').map(Number);
                const mag = Number(q.Magnitude || 0);
                const time = q.DateTime || q.DateTimeUTC || '';
                return [{
                    id:'bmkg-'+(q.Shakemap || time),
                    intensity:magToMMI(mag),
                    place:q.Wilayah || 'Indonesia',
                    time:formatTime(time), mag:'M'+mag.toFixed(1),
                    depth:String(q.Kedalaman || '—'),
                    agency:'BMKG', lat:coords[0]||0, lon:coords[1]||0,
                    colorClass:intensityClass(magToMMI(mag)),
                    ts:new Date(time).getTime()||Date.now()
                }];
            } catch(e) {
                setApiState('bmkg','bad'); console.warn('BMKG API:',e); return [];
            }
        }

        async function fetchSGC() {
            try {
                const url =
                    'https://srvags.sgc.gov.co/arcgis/rest/services/catalogo_sismos/catalogo_de_sismos_2/FeatureServer/0/query?' +
                    new URLSearchParams({
                        where:'1=1',
                        outFields:'*',
                        returnGeometry:'true',
                        resultRecordCount:'20',
                        orderByFields:'OBJECTID DESC',
                        outSR:'4326',
                        f:'geojson'
                    });
                const r = await fetch(url,{cache:'no-store'});
                if (!r.ok) throw new Error('HTTP '+r.status);
                const d = await r.json();
                setApiState('sgc','ok');
                return (d.features||[]).map((f,i)=>{
                    const p=f.properties||{};
                    const c=f.geometry?.coordinates||[0,0];
                    const mag=Number(p.MAGNITUD ?? p.MAG ?? p.MAGNI ?? p.magnitude ?? 0);
                    const depth=Number(p.PROFUNDIDAD ?? p.DEPTH ?? p.profundidad ?? 0);
                    const time=p.FECHA_HORA ?? p.FECHA ?? p.ORIGEN ?? p.datetime ?? '';
                    return {
                        id:'sgc-'+(p.OBJECTID??p.ID??i), intensity:magToMMI(mag),
                        place:p.MUNICIPIO ?? p.LOCALIZACION ?? p.NOMBRE ?? 'Colombia',
                        time:formatTime(time), mag:'M'+mag.toFixed(1),
                        depth:(depth||0)+' km', agency:'SGC',
                        lat:Number(c[1]), lon:Number(c[0]),
                        colorClass:intensityClass(magToMMI(mag)),
                        ts:new Date(time).getTime()||Date.now()
                    };
                }).filter(e=>e.mag!=='M0.0');
            } catch(e) {
                setApiState('sgc','bad'); console.warn('SGC API:',e); return [];
            }
        }

        async function fetchConCorsFallback(officialUrl, timeoutMs = 8000) {
            const candidatos = [
                officialUrl,
                'https://api.allorigins.win/raw?url=' + encodeURIComponent(officialUrl),
                'https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(officialUrl),
                'https://corsproxy.io/?' + encodeURIComponent(officialUrl)
            ];
            let ultimoError;
            for (const url of candidatos) {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), timeoutMs);
                try {
                    const r = await fetch(url, {cache:'no-store', signal: controller.signal});
                    clearTimeout(timer);
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r;
                } catch (e) {
                    clearTimeout(timer);
                    ultimoError = e;
                }
            }
            // Fallback directo a AllOrigins JSON (Evita bloqueo estricto de CORS)
            try {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), timeoutMs);
                const r = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent(officialUrl), {cache:'no-store', signal: controller.signal});
                clearTimeout(timer);
                if (r.ok) {
                    const json = await r.json();
                    if (json && json.contents) {
                        return new Response(json.contents, { status: 200, headers: { 'Content-Type': 'text/xml' } });
                    }
                }
            } catch (_) {}

            throw ultimoError || new Error('Todas las fuentes/proxies fallaron');
        }

        async function checkEarlyEst() {
            const urls = [
                'https://s3.rm.ingv.it/warning/monitor.xml',
                'http://early-est.rm.ingv.it/warning/monitor.xml',
                'https://webservices.ingv.it/fdsnws/event/1/query?format=xml&limit=1'
            ];
            for (const officialUrl of urls) {
                try {
                    const r = await fetchConCorsFallback(officialUrl, 6000);
                    const text = await r.text();
                    const xml = new DOMParser().parseFromString(text, 'text/xml');
                    if (!xml.querySelector('parsererror')) {
                        setApiState('earlyest','ok');
                        return;
                    }
                } catch (e) {}
            }
            setApiState('earlyest','bad');
            console.warn('Early-Est (INGV): No se pudo conectar a las fuentes de monitoreo');
        }
        checkEarlyEst();
        setInterval(checkEarlyEst, 8000);

        async function fetchSSN() {
            const ssnUrls = [
                'https://www.ssn.unam.mx/rss/ultimos-sismos.xml',
                'http://www.ssn.unam.mx/rss/ultimos-sismos.xml'
            ];
            let lastErr = null;
            for (const officialUrl of ssnUrls) {
                try {
                    const r = await fetchConCorsFallback(officialUrl);
                    const text = await r.text();
                    const xml = new DOMParser().parseFromString(text, 'text/xml');
                    if (xml.querySelector('parsererror')) throw new Error('XML SSN inválido');

                    const items = Array.from(xml.getElementsByTagName('item'));
                    if (!items.length) throw new Error('RSS SSN sin eventos');

                    setApiState('ssn','ok');

                    return items.map((it, i) => {
                        const title = (it.getElementsByTagName('title')[0]?.textContent || '').trim();
                        const descRaw = it.getElementsByTagName('description')[0]?.textContent || '';
                        
                        let mag = 0;
                        let place = title || 'México';
                        const magMatch = title.match(/(?:Magnitud|M)?\s*([\d.]+)/i);
                        if (magMatch) mag = parseFloat(magMatch[1]) || 0;
                        
                        const cleanPlace = title.replace(/^(?:Magnitud|M)?\s*[\d.]+\s*[\s,-]*/i, '').trim();
                        if (cleanPlace) place = cleanPlace;

                        const fechaMatch = descRaw.match(/Fecha:\s*([\d/-]+)\s+([\d:]+)/i);
                        const depthMatch = descRaw.match(/Profundidad:\s*([\d.]+)\s*km/i);

                        let lat = 0, lon = 0;
                        const latEl = it.getElementsByTagNameNS('*', 'lat')[0] || it.getElementsByTagName('geo:lat')[0] || it.getElementsByTagName('lat')[0];
                        const lonEl = it.getElementsByTagNameNS('*', 'long')[0] || it.getElementsByTagName('geo:long')[0] || it.getElementsByTagName('long')[0] || it.getElementsByTagNameNS('*', 'lon')[0];
                        if (latEl) lat = Number(latEl.textContent);
                        if (lonEl) lon = Number(lonEl.textContent);

                        // Respaldo de coordenadas por regex si falla el tag XML
                        const latMatch = descRaw.match(/Latitud:\s*([-\d.]+)/i);
                        const lonMatch = descRaw.match(/Longitud:\s*([-\d.]+)/i);
                        if (!lat && latMatch) lat = parseFloat(latMatch[1]);
                        if (!lon && lonMatch) lon = parseFloat(lonMatch[1]);

                        const isoTime = fechaMatch ? `${fechaMatch[1]}T${fechaMatch[2]}-06:00` : '';
                        const depth = depthMatch ? depthMatch[1] + ' km' : '—';

                        return {
                            id: 'ssn-' + (isoTime || i) + '-' + lat + '-' + lon,
                            intensity: magToMMI(mag),
                            place,
                            time: formatTime(isoTime),
                            mag: 'M' + mag.toFixed(1),
                            depth,
                            agency: 'SSN',
                            lat, lon,
                            colorClass: intensityClass(magToMMI(mag)),
                            ts: new Date(isoTime).getTime() || Date.now()
                        };
                    }).filter(e => e.mag !== 'M0.0');
                } catch (e) {
                    lastErr = e;
                }
            }
            setApiState('ssn','bad');
            console.warn('SSN México API:', lastErr);
            return [];
        }

        // Botón Japón → centrar mapa y mostrar estaciones JMA
        const btnJapan = document.getElementById('btnJapan');
        if (btnJapan) {
            btnJapan.addEventListener('click', async () => {
                map.setView([36.5, 138.0], 6);
                await loadJapanStations();
                if (!map.hasLayer(japanStationsLayer)) {
                    japanStationsLayer.addTo(map);
                }
                btnJapan.style.borderColor = '#4a9eff';
                btnJapan.style.background = 'rgba(26,58,92,0.95)';
                setTimeout(() => {
                    btnJapan.style.borderColor = '#555';
                    btnJapan.style.background = 'rgba(20,20,20,0.9)';
                }, 800);
            });
        }

        // Botón Pantalla Completa
        const btnFs = document.getElementById('btnFullscreen');
        if (btnFs) {
            btnFs.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.warn('No se pudo activar pantalla completa:', err);
                    });
                } else {
                    document.exitFullscreen();
                }
            });

            document.addEventListener('fullscreenchange', () => {
                if (document.fullscreenElement) {
                    btnFs.style.background = '#1a3a5c';
                    btnFs.style.borderColor = '#4a9eff';
                } else {
                    btnFs.style.background = '#222';
                    btnFs.style.borderColor = '#444';
                }
            });
        }
