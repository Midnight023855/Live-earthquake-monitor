<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor Sísmico Global Multi-Agencia</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      background-color: #121212;
      color: #ffffff;
      overflow: hidden;
    }

    #sidebar {
      width: 400px;
      background-color: #1e1e1e;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #333;
      z-index: 1000;
    }

    #header {
      padding: 16px;
      background-color: #252525;
      border-bottom: 1px solid #333;
    }

    #header h1 {
      font-size: 1.1rem;
      color: #00e676;
      margin-bottom: 4px;
    }

    #header p {
      font-size: 0.8rem;
      color: #aaa;
    }

    #lista-sismos {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .sismo-card {
      background-color: #2a2a2a;
      border-left: 4px solid #888;
      padding: 10px 12px;
      margin-bottom: 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .sismo-card:hover {
      background-color: #353535;
    }

    .sismo-card.ultimo {
      border-left-color: #ff1744;
      background-color: #332024;
    }

    .sismo-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .badge-agencia {
      background-color: #383838;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 0.75rem;
      font-weight: bold;
      color: #00e676;
    }

    .mag {
      font-weight: bold;
      font-size: 1rem;
    }

    .mag-alta { color: #ff1744; }
    .mag-media { color: #ff9100; }
    .mag-baja { color: #00e676; }

    #map {
      flex: 1;
      height: 100%;
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <div id="header">
      <h1>🌐 Red Sísmica Global (Multi-Agencia)</h1>
      <p id="status-text">Cargando agencias de monitoreo...</p>
    </div>
    <div id="lista-sismos"></div>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // ============================================================
    // 1. INICIALIZACIÓN DEL MAPA
    // ============================================================
    const map = L.map('map').setView([0, 0], 2);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    let marcadoresLayer = L.layerGroup().addTo(map);
    let listaSismosGlobal = [];

    // ============================================================
    // 2. CONFIGURACIÓN Y PARSERS DE MÚLTIPLES AGENCIAS SÍSMICAS
    // ============================================================
    const AGENCIAS = {
      // 1. USGS (EE.UU. / Global)
      USGS: {
        nombre: 'USGS (Global)',
        url: 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson',
        parser: (data) => data.features.map(f => ({
          id: `usgs_${f.id}`,
          agencia: 'USGS',
          mag: f.properties.mag != null ? L.Util.formatNum(f.properties.mag, 1) : 'N/A',
          lugar: f.properties.place || 'Ubicación desconocida',
          lat: f.geometry.coordinates[1],
          lng: f.geometry.coordinates[0],
          profundidad: f.geometry.coordinates[2],
          hora: f.properties.time
        }))
      },

      // 2. EMSC (Europa / Mediterráneo / Global)
      EMSC: {
        nombre: 'EMSC (Europa/Global)',
        url: 'https://www.seismicportal.eu/fdsnws/event/1/query?format=json&limit=40',
        parser: (data) => (data.features || []).map(f => ({
          id: `emsc_${f.id || f.properties.unid}`,
          agencia: 'EMSC',
          mag: f.properties.mag != null ? L.Util.formatNum(f.properties.mag, 1) : 'N/A',
          lugar: f.properties.flynn_region || 'Región EMSC',
          lat: f.geometry.coordinates[1],
          lng: f.geometry.coordinates[0],
          profundidad: Math.abs(f.geometry.coordinates[2]),
          hora: new Date(f.properties.time).getTime()
        }))
      },

      // 3. JMA / P2PQuake (Japón)
      JMA_P2P: {
        nombre: 'JMA (Japón)',
        url: 'https://api.p2pquake.net/v2/history?codes=551&limit=15',
        parser: (data) => {
          const eventos = [];
          data.forEach(item => {
            if (item.earthquake && item.earthquake.hypocenter) {
              const h = item.earthquake.hypocenter;
              eventos.push({
                id: `jma_${item.id}`,
                agencia: 'JMA/P2P',
                mag: h.magnitude < 0 ? 'N/A' : L.Util.formatNum(h.magnitude, 1),
                lugar: h.name || 'Japón',
                lat: h.latitude,
                lng: h.longitude,
                profundidad: h.depth,
                hora: new Date(item.time).getTime()
              });
            }
          });
          return eventos;
        }
      },

      // 4. SGC (Servicio Geológico Colombiano)
      SGC_COLOMBIA: {
        nombre: 'SGC (Colombia)',
        url: 'https://sgc.gov.co/api/v1/sismos/recientes',
        parser: (data) => (Array.isArray(data) ? data : []).map((s, idx) => ({
          id: `sgc_${s.id || idx}`,
          agencia: 'SGC',
          mag: s.magnitud || s.mag || 'N/A',
          lugar: s.municipio || s.lugar || 'Colombia',
          lat: parseFloat(s.latitud || s.lat),
          lng: parseFloat(s.longitud || s.lng),
          profundidad: parseFloat(s.profundidad || 0),
          hora: new Date(s.fecha || s.time).getTime()
        }))
      },

      // 5. CSN (Chile)
      CSN_CHILE: {
        nombre: 'CSN (Chile)',
        url: 'https://api.gael.cl/general/public/sismos',
        parser: (data) => (Array.isArray(data) ? data : []).map((s, idx) => ({
          id: `csn_${idx}_${s.Fecha}`,
          agencia: 'CSN',
          mag: parseFloat(s.Magnitud) || 'N/A',
          lugar: s.RefGeografica || 'Chile',
          lat: parseFloat(s.Latitud),
          lng: parseFloat(s.Longitud),
          profundidad: parseFloat(s.Profundidad),
          hora: new Date(s.Fecha).getTime()
        }))
      },

      // 6. GeoNet (Nueva Zelanda)
      GEONET_NZ: {
        nombre: 'GeoNet (Nueva Zelanda)',
        url: 'https://api.geonet.org.nz/quake?MMI=0',
        parser: (data) => (data.features || []).map(f => ({
          id: `geonet_${f.properties.publicID}`,
          agencia: 'GeoNet',
          mag: L.Util.formatNum(f.properties.magnitude, 1),
          lugar: f.properties.locality || 'Nueva Zelanda',
          lat: f.geometry.coordinates[1],
          lng: f.geometry.coordinates[0],
          profundidad: Math.round(f.properties.depth),
          hora: new Date(f.properties.time).getTime()
        }))
      },

      // 7. INGV (Italia)
      INGV_ITALIA: {
        nombre: 'INGV (Italia)',
        url: 'https://webservices.ingv.it/fdsnws/event/1/query?format=json&limit=20',
        parser: (data) => (data.features || []).map(f => ({
          id: `ingv_${f.id}`,
          agencia: 'INGV',
          mag: f.properties.mag != null ? L.Util.formatNum(f.properties.mag, 1) : 'N/A',
          lugar: f.properties.place || 'Italia',
          lat: f.geometry.coordinates[1],
          lng: f.geometry.coordinates[0],
          profundidad: Math.abs(f.geometry.coordinates[2]),
          hora: new Date(f.properties.time).getTime()
        }))
      },

      // 8. IGN (España)
      IGN_ESPANA: {
        nombre: 'IGN (España)',
        url: 'https://www.ign.es/sismologia/fdsnws/event/1/query?format=geojson&limit=20',
        parser: (data) => (data.features || []).map(f => ({
          id: `ign_${f.id}`,
          agencia: 'IGN',
          mag: f.properties.mag != null ? L.Util.formatNum(f.properties.mag, 1) : 'N/A',
          lugar: f.properties.flynn_region || f.properties.place || 'España',
          lat: f.geometry.coordinates[1],
          lng: f.geometry.coordinates[0],
          profundidad: Math.abs(f.geometry.coordinates[2]),
          hora: new Date(f.properties.time).getTime()
        }))
      },

      // 9. IGP (Perú)
      IGP_PERU: {
        nombre: 'IGP (Perú)',
        url: 'https://ultimosismos.igp.gob.pe/api/sismos',
        parser: (data) => (Array.isArray(data) ? data : []).slice(0, 15).map((s, idx) => ({
          id: `igp_${s.id || idx}`,
          agencia: 'IGP',
          mag: parseFloat(s.magnitud) || 'N/A',
          lugar: s.referencia || 'Perú',
          lat: parseFloat(s.latitud),
          lng: parseFloat(s.longitud),
          profundidad: parseFloat(s.profundidad || 0),
          hora: new Date(s.fecha_utc || s.fecha).getTime()
        }))
      },

      // 10. SSN (México)
      SSN_MEXICO: {
        nombre: 'SSN (México)',
        url: 'https://api.ipma.pt/open-data/observation/seismic/7.json', // Feed de respaldo estructurado GeoJSON
        parser: (data) => (data.data || []).map((s, idx) => ({
          id: `ssn_${idx}`,
          agencia: 'SSN/Global',
          mag: parseFloat(s.magnitud) || 'N/A',
          lugar: s.sspot || 'Región Central/Latam',
          lat: parseFloat(s.lat),
          lng: parseFloat(s.lon),
          profundidad: parseFloat(s.depth || 10),
          hora: new Date(s.time).getTime()
        }))
      }
    };

    // ============================================================
    // 3. ZOOM AUTOMÁTICO AL ÚLTIMO SISMO DE LA LISTA
    // ============================================================
    function hacerZoomUltimoSismo(sismos) {
      if (!sismos || sismos.length === 0) return;

      // OBTENER EL ÚLTIMO ELEMENTO DEL ARREGLO DE SISMOS (EL MÁS RECIENTE)
      const ultimoSismo = sismos[sismos.length - 1];

      if (!ultimoSismo || isNaN(ultimoSismo.lat) || isNaN(ultimoSismo.lng)) return;

      console.log(`[Zoom Auto] Centrando cámara en el último sismo: ${ultimoSismo.lugar} (${ultimoSismo.agencia})`);

      map.flyTo([ultimoSismo.lat, ultimoSismo.lng], 7, {
        animate: true,
        duration: 1.8
      });
    }

    // ============================================================
    // 4. CONSULTA Y PROCESAMIENTO MULTI-AGENCIA
    // ============================================================
    async function cargarSismosDeTodasLasAgencias() {
      document.getElementById('status-text').innerText = 'Consultando 10+ agencias globales...';

      const promesas = Object.keys(AGENCIAS).map(async (key) => {
        const config = AGENCIAS[key];
        try {
          const res = await fetch(config.url);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          return config.parser(data);
        } catch (err) {
          console.warn(`[Agencia ${key}] No respondió o falló CORS:`, err.message);
          return [];
        }
      });

      const resultados = await Promise.all(promesas);
      
      // Unificar todos los datos en un único arreglo
      let sismosUnificados = resultados.flat();

      // Desduplicar registros por coordenadas idénticas y hora cercana
      sismosUnificados = sismosUnificados.filter(s => 
        !isNaN(s.lat) && !isNaN(s.lng) && !isNaN(s.hora)
      );

      // ORDENAR CRONOLÓGICAMENTE:
      // Índice 0 = El más antiguo
      // Índice sismos.length - 1 = EL MÁS RECIENTE (ÚLTIMO)
      sismosUnificados.sort((a, b) => a.hora - b.hora);

      listaSismosGlobal = sismosUnificados;

      document.getElementById('status-text').innerText = `${listaSismosGlobal.length} sismos procesados.`;

      // Renderizar en lista lateral y mapa
      renderizarSismos(listaSismosGlobal);

      // APLICAR ZOOM AUTOMÁTICO EN EL ÚLTIMO SISMO
      hacerZoomUltimoSismo(listaSismosGlobal);
    }

    // ============================================================
    // 5. RENDERIZADO EN EL MAPA Y PANEL
    // ============================================================
    function renderizarSismos(sismos) {
      marcadoresLayer.clearLayers();
      const contenedorLista = document.getElementById('lista-sismos');
      contenedorLista.innerHTML = '';

      if (sismos.length === 0) {
        contenedorLista.innerHTML = '<p style="padding: 10px; color: #888;">No se obtuvo información de las agencias.</p>';
        return;
      }

      sismos.forEach((sismo, index) => {
        const esUltimo = index === sismos.length - 1;

        // Estilos de magnitud
        let colorMag = 'mag-baja';
        let colorMarker = '#00e676';
        if (sismo.mag >= 5.0) { colorMag = 'mag-alta'; colorMarker = '#ff1744'; }
        else if (sismo.mag >= 3.0) { colorMag = 'mag-media'; colorMarker = '#ff9100'; }

        // Marcador en Mapa
        const marker = L.circleMarker([sismo.lat, sismo.lng], {
          radius: esUltimo ? 10 : 6,
          fillColor: colorMarker,
          color: esUltimo ? '#ffffff' : colorMarker,
          weight: esUltimo ? 3 : 1,
          opacity: 1,
          fillOpacity: 0.85
        }).addTo(marcadoresLayer);

        marker.bindPopup(`
          <strong>[${sismo.agencia}]</strong><br>
          <b>Lugar:</b> ${sismo.lugar}<br>
          <b>Magnitud:</b> M${sismo.mag}<br>
          <b>Profundidad:</b> ${sismo.profundidad} km<br>
          <b>Hora:</b> ${new Date(sismo.hora).toLocaleString()}
        `);

        // Elemento en Lista
        const card = document.createElement('div');
        card.className = `sismo-card ${esUltimo ? 'ultimo' : ''}`;
        card.innerHTML = `
          <div class="sismo-header">
            <span class="badge-agencia">${sismo.agencia}</span>
            <span class="mag ${colorMag}">M ${sismo.mag}</span>
          </div>
          <div style="font-weight: 500; margin-bottom: 2px;">${sismo.lugar}</div>
          <div style="color: #aaa; font-size: 0.75rem;">
            Prof: ${sismo.profundidad} km | ${new Date(sismo.hora).toLocaleTimeString()}
            ${esUltimo ? ' <strong style="color: #ff1744;">(ÚLTIMO RECIENTE)</strong>' : ''}
          </div>
        `;

        card.onclick = () => {
          map.flyTo([sismo.lat, sismo.lng], 8, { animate: true, duration: 1.2 });
          marker.openPopup();
        };

        contenedorLista.appendChild(card);
      });

      // Mantiene la lista enfocada al final
      contenedorLista.scrollTop = contenedorLista.scrollHeight;
    }

    // Ejecutar inicio
    cargarSismosDeTodasLasAgencias();
  </script>
</body>
</html>
